DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 4
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "normalize"]

OPTIM:
  NAME: "sgd"
  LR: 0.0025
  MAX_EPOCH: 100
  LR_SCHEDULER: "cosine"
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.0005
  WARMUP_EPOCH: -1

TRAIN:
  PRINT_FREQ: 20

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  ERRORCOMPASS:
    CTX_INIT: "a photo of a"
    SCCM_LAMBDA: 1.0
    KL_LAMBDA: 1.0
    LAMBDA_CHC: 0.5
    LAMBDA_CPMC: 0.3
    TEMPLATE_TAU: 1.5
    N_PROMPTS: 50
    
